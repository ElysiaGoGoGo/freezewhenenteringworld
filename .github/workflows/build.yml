name: Build

on: [push, pull_request]


permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build


      - name: Locate main jar
        id: jar
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          shopt -s nullglob
          candidates=()
          for f in build/libs/*.jar; do
            case "$f" in
              *-sources.jar|*-dev.jar|*-javadoc.jar) continue ;;
            esac
            candidates+=("$f")
          done
          if [ "${#candidates[@]}" -ne 1 ]; then
            echo "::error::Expected exactly 1 publishable jar in build/libs, found ${#candidates[@]}"
            printf '  %s\n' "${candidates[@]}"
            exit 1
          fi
          echo "Resolved main jar: ${candidates[0]}"
          echo "path=${candidates[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Release
        id: release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.jar.outputs.path }}
